name: Synthetic annotated tag fixture
on:
  push:
    branches: [acceptance/tag-driver]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish isolated annotated tag on healthy fixture base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "NomadAnget/atelier-automation-fixture-20261014"
          test "$GITHUB_REF_NAME" = "acceptance/tag-driver"
          git config user.name acceptance-fixture
          git config user.email acceptance@localhost
          git show-ref --quiet refs/tags/v0.0.20261015 || git tag -a v0.0.20261015 6123f048335e2888d2a434fc338fc3d93a005390 -m "Synthetic annotated tag; isolated functional acceptance only"
          git -c credential.helper= -c 'credential.https://github.com.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin refs/tags/v0.0.20261015
          git rev-parse refs/tags/v0.0.20261015
          git rev-parse refs/tags/v0.0.20261015^{commit}
      - name: Export public synthetic Git objects only
        run: git bundle create fixture.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: functional-fixture-git-bundle
          path: fixture.bundle
