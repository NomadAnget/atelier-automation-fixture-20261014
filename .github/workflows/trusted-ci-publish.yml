name: Publish trusted CI receipt
on:
  repository_dispatch:
    types: [atelier_ci_result]
permissions:
  contents: read
jobs:
  publish:
    name: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: NomadAnget/atelier-automation-acceptance-20261014
          ref: f7f66672ff93672612af6a15553d3e67a777ed96
          token: ${{ secrets.GH_SYNC_TOKEN }}
          persist-credentials: false
          path: control
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv --python 3.11 .venv
      - name: Verify private receipt and publish only head/base/merge/result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          COORDINATOR_STATE_BRANCH: loop-state-20261014
          COORDINATOR_REPOSITORY: NomadAnget/atelier-automation-acceptance-20261014
          COORDINATOR_TRUSTED_SHA: f7f66672ff93672612af6a15553d3e67a777ed96
          PYTHONPATH: control/.github/loop-control
        run: .venv/bin/python -m coordination.ci publish --registry control/.github/loop-control/registry.json
