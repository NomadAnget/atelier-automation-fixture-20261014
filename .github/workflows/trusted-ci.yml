name: Public variant single-job trusted CI
on:
  repository_dispatch:
    types: [atelier_ci]
permissions:
  contents: read
concurrency:
  group: atelier-variant-ci-${{ github.repository }}-${{ github.event.client_payload.pr }}
  cancel-in-progress: false
jobs:
  variant-ci:
    if: (github.actor == github.repository_owner || github.actor == 'github-actions[bot]') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: NomadAnget/atelier-automation-acceptance-20261014
          ref: dcf9269e308eca055a27fde339760552e1b5fdc7
          token: ${{ secrets.GH_SYNC_TOKEN }}
          persist-credentials: false
          path: control
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv venv --python 3.11 .venv
        working-directory: control/.github/loop-control
      - name: Prepare, test, and persist metadata in this job
        working-directory: control/.github/loop-control
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COORDINATOR_STATE_BRANCH: loop-state-20261014
          COORDINATOR_REPOSITORY: NomadAnget/atelier-automation-acceptance-20261014
          COORDINATOR_TRUSTED_SHA: dcf9269e308eca055a27fde339760552e1b5fdc7
          PUBLIC_VARIANT_CI_ENABLED: "true"
        run: .venv/bin/python -m fixture_ci --registry registry.json --bundle "$RUNNER_TEMP/variant-ci-$GITHUB_RUN_ID"
